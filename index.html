<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Plano Estratégico de Aceleração — {{NOME}}</title>
<style>

/* ── RESET ───────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 210mm;
  margin: 0; padding: 0;
  background: #fff;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* ── BASE DE PÁGINA ──────────────────────────────────── */
.page {
  width: 210mm;
  height: 297mm;
  position: relative;
  overflow: hidden;
  page-break-after: always;
  page-break-inside: avoid;

  /* Imagem de fundo: cobre 100% da página */
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-position: center center;
}
.page:last-child { page-break-after: avoid; }

/* ── PÁGINA 1 — CAPA ─────────────────────────────────── */
/*
  Background: imagem gerada no ChatGPT (capa vermelha)
  Variáveis sobrepostas:
    - {{FOTO_URL}} → foto da aluna, posicionada no centro
    - {{NOME}}     → nome da aluna, posicionado abaixo da foto
*/
.p1 {
  background-image: url('https://raw.githubusercontent.com/bustiferramentas-web/pdi-protagonistas/main/images/pagina1.png');
}

/* Foto da aluna — posição calibrada sobre o espaço vazio da capa */
.p1-foto {
  position: absolute;
  /* Ajuste top/left/width/height conforme a posição exata na sua imagem */
  top: 26%;        /* distância do topo da página */
  left: 50%;
  transform: translateX(-50%);
  width: 88mm;
  height: 112mm;
  overflow: hidden;
}
.p1-foto img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}

/* Badge "Seja bem-vinda" — gerado dinamicamente sobre a imagem */
.p1-badge {
  position: absolute;
  top: 71%;         /* logo abaixo da foto */
  left: 50%;
  transform: translateX(-50%);
  background: #FFFFFF;
  padding: 2.5mm 12mm;
  white-space: nowrap;
}
.p1-badge span {
  font-family: 'Poppins', Arial, sans-serif;
  font-size: 8.5pt;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #3D0000;
}

/* Nome da aluna */
.p1-nome {
  position: absolute;
  top: 76%;         /* abaixo do badge */
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  text-align: center;
  font-family: Georgia, 'Times New Roman', serif;
  font-weight: 700;
  font-size: 22pt;
  color: #FFFFFF;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1.1;
}


/* ── PÁGINAS 2-5 — BACKGROUND + NOME NO HEADER/FOOTER ── */
/*
  Nas páginas internas, a imagem já contém todo o conteúdo.
  Sobrepõe apenas:
    - {{NOME}} no header (canto direito)
    - {{NOME}} no footer (canto direito)
*/

.p2 {
  background-image: url('https://raw.githubusercontent.com/bustiferramentas-web/pdi-protagonistas/main/images/pagina2.png');
}
.p3 {
  background-image: url('https://raw.githubusercontent.com/bustiferramentas-web/pdi-protagonistas/main/images/pagina3.png');
}
.p4 {
  background-image: url('https://raw.githubusercontent.com/bustiferramentas-web/pdi-protagonistas/main/images/pagina4.png');
}
.p5 {
  background-image: url('https://raw.githubusercontent.com/bustiferramentas-web/pdi-protagonistas/main/images/pagina5.png');
}

/* Nome no header direito — páginas 2 a 5 */
.nome-header {
  position: absolute;
  top: 15mm;        /* alinhado à altura do header */
  right: 16mm;
  font-family: 'Poppins', Arial, sans-serif;
  font-size: 7.5pt;
  font-weight: 300;
  color: #A08080;
  letter-spacing: 0.06em;
  white-space: nowrap;
}

/* Nome no footer direito — páginas 2 a 5 */
.nome-footer {
  position: absolute;
  bottom: 9mm;      /* alinhado à altura do footer */
  right: 16mm;
  font-family: 'Poppins', Arial, sans-serif;
  font-size: 6.5pt;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: #A08080;
  white-space: nowrap;
}

/* ── PRINT ───────────────────────────────────────────── */
@media print {
  @page { size: A4; margin: 0; }
  body { margin: 0; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: avoid; }
}

</style>
</head>
<body>

<!-- ══════════════════════════════════
     PÁGINA 1 — CAPA
     Variáveis: {{FOTO_URL}}, {{NOME}}
══════════════════════════════════ -->
<div class="page p1">

  <!-- Foto da aluna sobreposta no espaço vazio central -->
  <div class="p1-foto">
    <img src="{{FOTO_URL}}" alt="{{NOME}}" />
  </div>

  <!-- Badge "Seja bem-vinda" -->
  <div class="p1-badge">
    <span>Seja Bem-Vinda</span>
  </div>

  <!-- Nome da aluna -->
  <div class="p1-nome">{{NOME}}</div>

</div>


<!-- ══════════════════════════════════
     PÁGINA 2 — CARTA DA MENTORA
     Variável: {{NOME}} (header + footer)
══════════════════════════════════ -->
<div class="page p2">
  <span class="nome-header">{{NOME}}</span>
  <span class="nome-footer">{{NOME}}</span>
</div>


<!-- ══════════════════════════════════
     PÁGINA 3 — SEMANAS 1 e 2
     Variável: {{NOME}} (header + footer)
══════════════════════════════════ -->
<div class="page p3">
  <span class="nome-header">{{NOME}}</span>
  <span class="nome-footer">{{NOME}}</span>
</div>


<!-- ══════════════════════════════════
     PÁGINA 4 — SEMANAS 3 e 4
     Variável: {{NOME}} (header + footer)
══════════════════════════════════ -->
<div class="page p4">
  <span class="nome-header">{{NOME}}</span>
  <span class="nome-footer">{{NOME}}</span>
</div>


<!-- ══════════════════════════════════
     PÁGINA 5 — MÉTRICAS
     Variável: {{NOME}} (header + footer)
══════════════════════════════════ -->
<div class="page p5">
  <span class="nome-header">{{NOME}}</span>
  <span class="nome-footer">{{NOME}}</span>
</div>


</body>
</html>
